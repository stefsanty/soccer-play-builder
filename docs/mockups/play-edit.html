<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play UI - Edit mode</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#05080b;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#e8edf2}
a{color:#4cc9f0}a:hover{color:#8fe3ff}
button{font-family:inherit;cursor:pointer}
a{cursor:pointer}

body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px;gap:40px;flex-wrap:wrap}
.phone{width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.7)}
.phone>div{font-family:inherit !important}

.pitch{position:relative;background:#0b1015}
.pitch>svg{display:block}
.note{position:absolute;left:12px;right:12px;display:flex;align-items:flex-start;gap:10px;padding:8px 12px 8px 9px;
  border:1px solid rgba(255,255,255,.09);background:rgba(11,16,21,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:#e8edf2;border-radius:20px;text-align:left;font-size:13px;line-height:1.35;font-weight:500;
  box-shadow:0 6px 20px rgba(0,0,0,.45);transition:border-radius .15s ease}
.note:hover{border-color:rgba(255,255,255,.16)}
.note-top{top:12px}.note-bottom{bottom:12px}
.pitch-top{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pitch-top .note{position:static;width:100%}
.note-badge{flex:none;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700}
.note-top .note-badge{background:#4cc9f0;color:#04202b}
.note-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.note-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.note-desc{display:none;color:#9aa7b4;font-weight:400;font-size:12.5px;line-height:1.4}
.note-chev{flex:none;width:16px;height:16px;color:#9aa7b4;margin-top:3px;transition:transform .15s ease}
.note[aria-expanded="true"]{border-radius:14px}
.note[aria-expanded="true"] .note-title{white-space:normal}
.note[aria-expanded="true"] .note-desc{display:block}
.note[aria-expanded="true"] .note-chev{transform:rotate(180deg)}
/* editor-only guidance: teal, with a pencil, so it never reads as play content */
.tip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border-radius:999px;white-space:nowrap;
  background:rgba(20,184,166,.16);border:1px solid rgba(20,184,166,.5);color:#ccfbf1;font-size:12px;font-weight:500;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tip svg{width:13px;height:13px;color:#14b8a6;flex:none}
</style></head>
<body>
<div class="phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b1015; color: #e8edf2; display: flex; flex-direction: column; padding-top: 54px">

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px 12px; background: #0b1015; border-top: 1px solid #243040"><button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: #14b8a6; color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; font-family: inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5H19V11"></path><path d="M19 5L5 19"></path></svg>Pass</button><button type="button" style="height: 44px; border: 0; border-radius: 10px; background: none; color: #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; font-family: inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"></path><path d="m15 19-3 3-3-3"></path><path d="m19 9 3 3-3 3"></path><path d="M2 12h20"></path><path d="m5 9-3 3 3 3"></path><path d="m9 5 3-3 3 3"></path></svg>Move</button><button type="button" style="height: 44px; border: 0; border-radius: 10px; background: none; color: #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; font-family: inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5"></path></svg>Line</button><button type="button" style="height: 44px; border: 0; border-radius: 10px; background: none; color: #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; font-family: inherit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 8-16 8 4-8z" fill="currentColor" stroke="none"></path></svg>Face</button></div>

  <div style="flex: 1 1 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 8px 12px 0 12px; background: #151b22; border-top: 1px solid #243040">
    <div style="display: flex; gap: 10px; align-items: center">
    <div style="flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: center">

      <button type="button" aria-current="step" style="height: 36px; border-radius: 18px; border: 0; background: #4cc9f0; color: #04202b; font-size: 13px; font-weight: 700; font-family: inherit">1</button>
      <button type="button" style="height: 36px; border-radius: 18px; border: 0; background: #2a3644; color: #e8edf2; font-size: 13px; font-weight: 700; font-family: inherit">2</button>
      <button type="button" style="height: 36px; border-radius: 18px; border: 0; background: #2a3644; color: #e8edf2; font-size: 13px; font-weight: 700; font-family: inherit">3</button>
      <button type="button" style="height: 36px; border-radius: 18px; border: 0; background: #2a3644; color: #e8edf2; font-size: 13px; font-weight: 700; font-family: inherit">4</button>
      <button type="button" style="height: 36px; border-radius: 18px; border: 0; background: #2a3644; color: #e8edf2; font-size: 13px; font-weight: 700; font-family: inherit">5</button>

    </div>
    
    </div>
    <div style="display: flex; gap: 10px; align-items: start">
    <div style="flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: start" aria-label="Branch steps"><div></div><div style="grid-column: span 1; display: flex; align-items: flex-end; height: 34px"><span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end"><span aria-hidden="true" style="width: 0; height: 6px; border-left: 2px dotted rgba(76,201,240,0.7)"></span><button type="button" aria-expanded="false" aria-label="Branch 1a" style="width: 28px; height: 28px; border-radius: 14px; background: #1c242d; border: 1px dashed rgba(76,201,240,0.75); color: #e8edf2; font-size: 11px; font-weight: 600; font-family: inherit; padding: 0; display: flex; align-items: center; justify-content: center; flex: none">1a</button></span></div><div></div><div style="grid-column: span 3; display: flex; align-items: flex-end; height: 34px"><span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end"><span aria-hidden="true" style="width: 0; height: 6px; border-left: 2px dotted rgba(76,201,240,0.7)"></span><button type="button" aria-expanded="true" aria-label="Branch 3a" style="width: 28px; height: 28px; border-radius: 14px; background: #17303d; border: 1px dashed rgba(76,201,240,0.75); color: #e8edf2; font-size: 11px; font-weight: 600; font-family: inherit; padding: 0; display: flex; align-items: center; justify-content: center; flex: none">3a</button></span><span aria-hidden="true" style="flex: none; width: 6px; height: 0; border-top: 2px dotted rgba(76,201,240,0.7); margin-bottom: 13px"></span><span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end"><button type="button" aria-expanded="true" aria-label="Branch 3b" style="width: 28px; height: 28px; border-radius: 14px; background: #17303d; border: 1px dashed rgba(76,201,240,0.75); color: #e8edf2; font-size: 11px; font-weight: 600; font-family: inherit; padding: 0; display: flex; align-items: center; justify-content: center; flex: none">3b</button></span><span aria-hidden="true" style="flex: none; width: 6px; height: 0; border-top: 2px dotted rgba(76,201,240,0.7); margin-bottom: 13px"></span><span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end"><button type="button" aria-expanded="true" aria-label="Branch 3c" style="width: 28px; height: 28px; border-radius: 14px; background: #17303d; border: 1px dashed rgba(76,201,240,0.75); color: #e8edf2; font-size: 11px; font-weight: 600; font-family: inherit; padding: 0; display: flex; align-items: center; justify-content: center; flex: none">3c</button></span></div><div></div></div>

</div><script>

</script>
